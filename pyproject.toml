[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[project]
name = "buildstock-processor"
version = "0.1.0"
description = "Download and analyze NLR ComStock and ResStock data."
readme = "README.md"
authors = [{ name = "Nicholas Long" }]
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "requests>=2.32.5",
    "geopandas>=1.1.4",
    "tqdm>=4.69.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.1",
    # although not called directly, these are
    # needed for processing parquet files
    "fastparquet>=2026.5.0",
    "pyarrow>=25.0.0",
    # needed to read ResStock's measure_name_crosswalk .xlsx file
    "openpyxl>=3.1.5",
]

[dependency-groups]
api = [
    "fastapi>=0.140.9",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbformat>=5.10.4",
    "httpx>=0.28.1",
]

[tool.uv]
package = true

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "01_data_sampling_example.ipynb",
    "02_washington_dc_stock_analysis.ipynb",
    "03_composite_building_example.ipynb",
]

[tool.mypy]
python_version = "3.12"
files = [
    "src/buildstock_processor/",
    "api/",
    "tests/",
]
ignore_missing_imports = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Pydantic v2's BaseModel resolves to `Any` under this environment's mypy build (a real, reproducible
# incompatibility -- confirmed with a minimal `class Foo(BaseModel): x: int` reproduction, not specific to
# this project's code), which otherwise cascades into spurious "Class cannot subclass BaseModel" and
# "Untyped decorator" errors throughout the API layer. Narrowly suppress just those two error codes for
# the api package so real type errors elsewhere still fail normally.
module = "api.*"
disable_error_code = ["misc", "untyped-decorator"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--disable-warnings"
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests that download data",
    "unit: marks tests as fast unit tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
