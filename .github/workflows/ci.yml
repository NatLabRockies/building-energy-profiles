name: CI

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # for windows and linux
    env:
      # Keep CI strict while running the Makefile targets: fail if uv.lock is out of date and use short tracebacks.
      UV_LOCKED: "1"
      PYTEST_ADDOPTS: --tb=short
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - name: Install dependencies
        run: make install-python
      - name: Run pre-commit
        run: make lint
      - name: Run unit tests
        run: make test-unit
      - name: Run integration tests (fast)
        run: make test-integration
