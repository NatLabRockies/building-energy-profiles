name: CI

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # for windows and linux
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev --group api
      - name: Run pre-commit
        run: uv run pre-commit run --all-files
      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short -m "unit"
      - name: Run integration tests (fast)
        run: uv run pytest tests/ -v --tb=short -m "integration"
