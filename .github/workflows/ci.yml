name: CI

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # for windows and linux
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev --group api
      - name: Run pre-commit
        run: uv run pre-commit run --all-files
      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short -m "unit"
      - name: Run integration tests (fast)
        run: uv run pytest tests/ -v --tb=short -m "integration"

  # Best-effort, informational only: these notebooks download and process full-state ComStock/ResStock
  # metadata (e.g. 01_data_sampling_example.ipynb's state="CA", county_name="All", building_type="All"
  # is a ~8GB DataFrame once loaded). That can exceed the memory available on constrained CI runners,
  # which reliably OOM-crashes the whole runner (not just the Python subprocess) on ubuntu-latest -- a
  # step-level `continue-on-error` can't catch that since the runner itself disappears mid-job. Running
  # these in their own job with job-level `continue-on-error` means a demo-notebook memory ceiling can no
  # longer fail the required `test` job/PRs.
  notebook-smoke-test:
    needs: test
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # for windows and linux
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --group dev --group api
      # Running notebook will download the comstock data and run
      # the entire notebook. It will take ~10 minutes to run on CI because
      # the data are downloaded every time.
      - name: Run notebook and check for completion
        env:
          TEST_DATA: "true"
        timeout-minutes: 15
        run: uv run jupyter nbconvert --to html --execute 01_data_sampling_example.ipynb --output test_output-${{ github.run_id }}.html
      - name: Upload HTML Artifact
        if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: notebook-html-${{ github.run_id }}
          path: test_output-${{ github.run_id }}.html
      - name: Run Washington DC notebook integration test
        if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 15
        env:
          BUILDSTOCK_DATA_DIR: ${{ runner.temp }}/dc-stock-analysis
        run: >-
          uv run jupyter nbconvert --to html --execute
          02_washington_dc_stock_analysis.ipynb
          --output dc-stock-analysis-${{ github.run_id }}.html
      - name: Upload Washington DC notebook artifact
        if: ${{ matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: dc-stock-analysis-${{ github.run_id }}
          path: dc-stock-analysis-${{ github.run_id }}.html
